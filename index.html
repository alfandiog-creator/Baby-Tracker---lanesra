<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F9">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Baby Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#FFF8F9;--card:#FFFFFF;--ink:#2E2326;--muted:#8C7A7E;--line:#F2E2E5;--acc:#F7879A;--acc-ink:#D4566E;--acc-soft:#FDEBEE;--warm:#F7879A;--warm-soft:#FDEBEE;--danger:#C2473A;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-size:15px;font-weight:700;color:var(--acc-ink);letter-spacing:0;margin-top:2px}
.role{font-size:12px;padding:6px 12px;border-radius:99px;background:var(--acc-soft);color:var(--acc-ink);font-weight:700;white-space:nowrap;margin-top:2px}
.datenav{display:flex;align-items:center;gap:8px;margin:14px 0}
.datenav .lbl{flex:1;text-align:center;font-weight:700;font-size:15px}
.datenav .lbl small{display:block;font-weight:600;font-size:11px;color:var(--acc-ink)}
.navbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}
.sumA{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;margin-bottom:12px}
.sumA div{text-align:center;border-left:1px solid var(--line);padding:0 2px}
.sumA div:first-child{border-left:0}
.sumA b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.sumA span{font-size:10.5px;color:var(--muted);font-weight:600}
.sumA .full b{color:var(--acc-ink)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sum span{font-size:11px;color:var(--muted);font-weight:600}
.sum.full b{color:var(--acc-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.card-h h2{font-size:15px;margin:0;font-weight:800}
.meta{font-size:12px;color:var(--muted);font-weight:600}
.addbtn{font-size:12px;font-weight:800;color:var(--acc-ink);padding:5px 10px;border-radius:99px;background:var(--acc-soft)}
.supp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.supp{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1.5px dashed var(--line);min-height:62px}
.supp .ic{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;font-weight:800}
.supp b{font-size:14px}
.supp small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.supp.done{border:1.5px solid transparent;background:var(--acc-soft)}
.supp.done .ic{background:var(--acc);border-color:var(--acc-ink);color:#fff}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:var(--muted);position:relative}
.dot small{font-size:10px;font-weight:600;line-height:1.25}
.dot small.who{font-size:9px;opacity:.9}
.dot.done{background:var(--acc);border:2px solid var(--acc);color:#fff}
.dot .nb{position:absolute;top:-2px;right:-2px;font-size:12px}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.trows .trow:first-child{border-top:0}
.tnum{width:28px;height:28px;border-radius:50%;background:var(--warm-soft);color:var(--acc-ink);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.trow.has .tnum{background:var(--warm);color:#fff}
.tparts{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px}
.chip{padding:6px 12px;border-radius:12px;background:var(--warm-soft);font-size:13px;font-weight:700;text-align:left;line-height:1.25}
.chip small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.chip.live{background:var(--warm);color:#fff}
.empty{color:var(--muted);font-size:13px}
.tsum{font-size:12px;color:var(--muted);font-weight:600}
.tact{display:flex;gap:6px}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);font-size:15px;font-weight:700}
.timerbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:10px;background:var(--warm);color:#fff;padding:12px 12px 12px 16px;border-radius:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.timerbar .clock{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timerbar .grow{flex:1;font-size:12px;line-height:1.35}
.timerbar button{background:rgba(255,255,255,.22);color:#fff;padding:9px 12px;border-radius:11px;font-weight:800;font-size:13px}
.timerbar button.solid{background:#fff;color:var(--acc-ink)}
.note-dot{font-size:11px;margin-left:2px}
.cal{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;vertical-align:-2px;margin-right:5px;flex:none}
.datenav .lbl .cal{width:16px;height:16px;vertical-align:-3px}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin:8px 0 0}
.linkbtn{display:block;margin:4px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;padding:9px 0 11px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.on{color:var(--acc-ink);font-weight:800}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.banner{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--warm-soft);margin:12px 0;line-height:1.45}
#sb{position:fixed;inset:0;background:rgba(20,15,10,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:calc(28px + env(safe-area-inset-top)) 12px 16px;overflow:auto}
#sb[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:500px;border-radius:20px;padding:18px 18px 0;max-height:calc(100vh - 60px - env(safe-area-inset-top));max-height:calc(100dvh - 60px - env(safe-area-inset-top));overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.sheet .btns{position:sticky;bottom:0;background:var(--card);padding:12px 0 16px;margin-top:4px}
.sheet h3{margin:0 0 2px;font-size:18px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:12px}
label.f input,label.f textarea,.sadd input{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:46px;margin-top:5px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input[type=time]::-webkit-date-and-time-value{text-align:left}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.quick button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:700}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:800;border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc-ink)}
.btn.danger{color:var(--danger);flex:0 0 auto;padding:13px 16px}
.btn.full{display:block;width:100%}
.info{font-size:12px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.55}
.info b{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:16px;align-items:center;z-index:60;width:max-content;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast[hidden]{display:none}
#toast button{color:#FFB3C0;font-weight:800;white-space:nowrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--acc-soft);color:var(--acc-ink)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px}
.bar{flex:1;background:var(--warm);border-radius:4px 4px 0 0;min-height:3px}
.bar.zero{background:var(--line)}
.xl{display:flex;gap:3px;font-size:9px;color:var(--muted);margin-top:5px;font-weight:600}
.xl span{flex:1;text-align:center;white-space:nowrap}
table.rk{width:100%;border-collapse:collapse;font-size:13px}
.rk th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:4px 4px 6px}
.rk td{padding:10px 4px;border-top:1px solid var(--line)}
.rk tr[data-a]{cursor:pointer}
.ok{color:var(--acc-ink);font-weight:800}
.no{color:var(--muted)}
.step{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.step b{font-size:14px}
.step:first-of-type{border-top:0}
.slist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.sitem{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);font-weight:600}
.sitem button{width:30px;height:30px;border-radius:9px;color:var(--danger);font-weight:800}
.sadd{display:flex;gap:8px;margin-bottom:12px}
.sadd input{margin:0;flex:1}
.sadd .btn{flex:0 0 auto;padding:11px 16px}
.hist{font-size:12px;color:var(--muted);margin:0 0 12px;padding-left:16px;line-height:1.6}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.drow small{display:block;color:var(--muted);font-size:12px}
.drow button{color:var(--acc-ink);font-weight:800;font-size:13px}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.loading{color:var(--muted);font-size:13px;text-align:center;padding:6px 0 10px}
/* kesehatan */
label.f select{display:block;width:100%;min-width:0;max-width:100%;min-height:46px;margin-top:5px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.f-lbl{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:8px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:700}
.chips button.on{background:var(--acc);border-color:var(--acc-ink);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.three label.f input{margin-top:0}
.sec{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px}
.sec h2{font-size:12px;margin:0;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.next{display:block;width:100%;text-align:left;background:var(--acc);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:14px}
.next .k{font-size:11px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.next b{display:block;font-size:17px;margin:4px 0 2px}
.next .m{display:block;font-size:12.5px;font-weight:600;line-height:1.5}
.next .cd{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.card .item:first-child{border-top:0;padding-top:0}
.card .item:last-child{padding-bottom:0}
.item .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{font-size:14px;display:block}
.item .t small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:1px;overflow-wrap:anywhere}
.pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;align-self:flex-start;background:var(--line);color:var(--muted)}
.p-imunisasi{background:rgba(107,84,184,.14);color:#7A63C6}
.p-kontrol,.p-on{background:var(--acc-soft);color:var(--acc-ink)}
.p-sakit{background:var(--warm-soft);color:var(--acc-ink)}
.item .ic.p-imunisasi{background:rgba(107,84,184,.14)}
.item .ic.p-kontrol{background:var(--acc-soft)}
.item .ic.p-sakit{background:var(--warm-soft)}
.two>label,.three>label{min-width:0}
.two input[type=date],.two input[type=time]{padding-left:10px;padding-right:8px}
.mini{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mini span{font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 7px}
.btn.outline{border-color:var(--acc-ink);color:var(--acc-ink);margin-bottom:4px}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
/* revisi */
input,select,textarea,button{font-family:inherit}
label.f input,label.f textarea,label.f select,.sadd input,.pre input,.pre span{font-weight:500;font-size:14px}
label.f input,label.f select,.sadd input{min-height:44px}
input[type=date],input[type=time]{font-family:inherit;font-size:14px}
input::-webkit-date-and-time-value{font-family:inherit}
::placeholder{font-weight:400;font-size:14px;color:#B9A9AD;opacity:1}
.secttl{font-size:13px;font-weight:800;color:var(--muted);margin:4px 2px 8px;text-transform:uppercase;letter-spacing:.05em}
.ck{color:#2FA36B;font-style:normal;font-weight:800;margin-right:3px}
.meta .ck{margin-right:4px}
.clk{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;vertical-align:-2px;margin-right:4px}
.pre{display:flex;align-items:stretch;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.pre span{display:grid;place-items:center;padding:0 10px 0 12px;font-weight:700;color:var(--muted);font-size:15px;border-right:1px solid var(--line);background:var(--card)}
.pre input{flex:1;min-width:0;border:0;background:transparent;padding:11px 12px;color:var(--ink);font-family:inherit;min-height:44px;outline:none}
.pre:focus-within{border-color:var(--acc)}
label.f .pre input{border:0;margin:0;background:transparent;border-radius:0;min-height:44px;padding:11px 12px}
.chips.sm{margin:6px 0 0}
.chips.sm button{padding:5px 10px;font-size:12px}
.vax{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.vax .chips{margin-bottom:0}
.vax .chips button.on::before{content:'✓ ';}
.vax small{display:block;font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.gz{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gz span{font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 7px;color:var(--ink)}
.gz i{font-style:normal;font-weight:800}
.st-ok{color:#2FA36B}.st-warn{color:#C9862B}.st-bad{color:#C2473A}
.todo{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:#C9862B;background:#FFF4E2;border-radius:99px;padding:3px 9px}
.next .upd{display:inline-block;margin:8px 0 0 6px;background:#fff;color:var(--acc-ink);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
.growth{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.growth h2{font-size:15px;margin:0;font-weight:800}
.grow3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grow3 div{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
.grow3 b{display:block;font-size:17px;font-weight:800}
.grow3 span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.grow3 em{display:block;font-style:normal;font-size:11px;font-weight:800;margin-top:3px}
.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;font-weight:500;line-height:1;box-shadow:0 8px 22px rgba(247,135,154,.45);z-index:7;display:grid;place-items:center}
.need{align-items:flex-start}
.need .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:4px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.need .chk.on{background:#2FA36B;border-color:#2FA36B}
.need .nbody{display:block;width:100%;text-align:left}
.need .nbody b{font-size:14px;display:block}
.need.done .nbody b{text-decoration:line-through;color:var(--muted)}
.shop{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;font-weight:800;color:var(--acc-ink);background:var(--acc-soft);padding:5px 10px;border-radius:99px;text-decoration:none}
.p-tinggi{background:#FDE3E1;color:#C2473A}.p-sedang{background:#FFF1DC;color:#B7791F}.p-rendah{background:var(--line);color:var(--muted)}
/* tanggal & jam */
.dtw{position:relative}
.dtw input{padding-right:38px!important}
.dtw input::-webkit-calendar-picker-indicator{opacity:0;cursor:pointer;position:absolute;right:0;top:0;width:44px;height:100%}
.dtw .dic{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.dtw .dph{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:400;color:#B9A9AD;pointer-events:none;display:none}
.dtw.empty .dph{display:block}
.dtw.empty input{color:transparent}
.dtw.empty input:focus{color:var(--ink)}
.dtw.empty input:focus~.dph{display:none}
/* angka kecil */
.u{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;min-width:0}
.chart .col .bar{flex:none;min-height:3px}
.chart .bv{height:16px;line-height:16px;text-align:center;font-size:10px;font-weight:700;color:var(--acc-ink);white-space:nowrap}
.gz span.g-ok{border-color:#BFE5CF;background:#EEF9F2;color:#1F7A4D}
.gz span.g-warn{border-color:#F3D9A8;background:#FFF6E6;color:#9A6417}
.gz span.g-bad{border-color:#F2C1BC;background:#FDEDEB;color:#B23A2E}
.growth details{margin-top:8px}
.growth summary{font-size:12px;font-weight:700;color:var(--acc-ink);cursor:pointer;list-style:none}
.growth summary::-webkit-details-marker{display:none}
.heart{color:var(--acc);margin-left:4px}
.item .nbody{display:block;width:100%;text-align:left}
.notebtn{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;font-weight:800;color:var(--acc-ink);background:var(--acc-soft);padding:5px 10px;border-radius:99px}
.next .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.next .acts .cd{margin:0}
.next .acts button{background:#fff;color:var(--acc-ink);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
.notebox{white-space:pre-wrap;font-size:15px;line-height:1.6;background:var(--bg);border-radius:12px;padding:14px;margin-bottom:12px;max-height:55vh;overflow:auto}
.qty{font-size:12px;font-weight:800;color:var(--acc-ink);background:var(--acc-soft);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.again{display:inline-flex;align-items:center;gap:4px;margin:7px 0 0 6px;font-size:12px;font-weight:800;color:#1F7A4D;background:#EEF9F2;padding:5px 10px;border-radius:99px}
label.f textarea.link{font-size:13px;word-break:break-all}
.perday{margin-bottom:12px}
.item .t small{line-height:1.65}
.next .m{line-height:1.7}
.rcv{cursor:pointer;display:inline-block;font-size:11px;font-weight:800;color:#1F7A4D;background:#EEF9F2;border:1px solid #BFE5CF;border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:1px}
.notebtn.tf{color:#1F7A4D;background:#EEF9F2;margin-right:6px}

.login{min-height:calc(100vh - 32px);display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.login .brand{font-size:26px;text-align:center;margin-bottom:26px}
.login .brand small{font-size:18px;margin-top:4px}
.login h3{font-size:15px;margin:0 0 10px;font-weight:800}
.rolepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.rolepick button{padding:16px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:15px}
.rolepick button.on{border-color:var(--acc-ink);background:var(--acc-soft);color:var(--acc-ink)}
.login label.f input{background:var(--card)}
.login .btn{flex:none}
.splash{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-weight:600}
.migr{background:var(--acc-soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:13px;line-height:1.5}
.migr .btn{margin-top:8px;display:block;width:100%}
.lerr{color:var(--danger);font-size:13px;font-weight:600;margin:-4px 0 12px;min-height:18px}

/* ---------- subscriptions ---------- */
let unsubDay=null,dayTimer=null;
function subscribeDay(){
  if(S.local){S.logs=(S.localStore[S.date]=S.localStore[S.date]||[]);S.loading=false;render();return;}
  if(unsubDay)unsubDay();
  clearTimeout(dayTimer);
  const date=S.date;
  S.logs=[];S.loading=true;S.stale=false;S.err='';render();
  dayTimer=setTimeout(()=>{if(date===S.date){S.stale=true;S.loading=false;render();}},10000);
  unsubDay=dayCol(date).onSnapshot(snap=>{
    if(date!==S.date)return;
    S.logs=snap.docs.map(d=>({id:d.id,...d.data()}));
    S.loading=false;
    if(!snap.metadata.fromCache){clearTimeout(dayTimer);S.stale=false;}
    render();
  },(err)=>{clearTimeout(dayTimer);S.loading=false;S.err=(err&&err.code==='permission-denied')?'Akses ke data ditolak. Pastikan aturan keamanan (Rules) Firestore sudah dipasang dan email akun sesuai.':'Catatan tidak bisa dimuat. Tutup lalu buka lagi aplikasinya.';render();});
}
function subscribeShared(){
  S.db.doc('config/main').onSnapshot(s=>{
    const d=s.exists?s.data():{};
    S.cfg={...DEF,supplements:Array.isArray(d.supplements)?[...d.supplements]:[...DEF.supplements]};
    S.cfgRaw=s.exists?d:null;if(!s.metadata.fromCache)S.cfgLoaded=true;
    maybeConvertSupps();render();
  },()=>{});
  S.db.doc('meta/migration').onSnapshot(s=>{S.migrated=s.exists;render();},()=>{});
  S.db.collection('visits').onSnapshot(s=>{S.visits=s.docs.map(d=>({id:d.id,...d.data()}));render();},()=>{});
  S.db.collection('meds').onSnapshot(s=>{S.meds=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)S.medsLoaded=true;maybeConvertSupps();render();},()=>{});
  S.db.collection('needs').onSnapshot(s=>{S.needs=s.docs.map(d=>({id:d.id,...d.data()}));render();},()=>{});
  S.db.doc('config/child').onSnapshot(s=>{S.child={...CHILD_DEF,...(s.exists?s.data():{})};render();},()=>{});
  S.db.doc('timer/tummy').onSnapshot(s=>{
    const d=s.exists?s.data():null;S.timer=d&&d.running?d:null;render();
  },()=>{});
}
async function loadRecap(){
  const n=S.recapRange,today=ymd();
  const days=range(n).map(i=>addDays(today,-(i-1)));
  S.recap={loading:true,n};render();
  const out=[];
  for(let i=0;i<days.length;i+=6){
    const chunk=days.slice(i,i+6);
    const res=await Promise.all(chunk.map(async d=>{
      if(S.local)return [d,S.localStore[d]||[]];
      try{const snap=await dayCol(d).get();return [d,snap.docs.map(x=>({id:x.id,...x.data()}))];}catch(e){return [d,null];}
    }));
    out.push(...res);
  }
  if(S.recapRange!==n)return;
  S.recap={loading:false,n,days:out};render();
}

const DIC='<svg class="dic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

function enhanceDates(root){
  root.querySelectorAll('input[type=date],input[type=time]').forEach(inp=>{
    if(inp.parentElement.classList.contains('dtw'))return;
    const w=document.createElement('div');w.className='dtw';
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const isD=inp.type==='date';
    w.insertAdjacentHTML('beforeend',(isD?DIC:TIC)+`<span class="dph">${isD?'Pilih tanggal':'Pilih jam'}</span>`);
    const sync=()=>w.classList.toggle('empty',!inp.value);
    inp.addEventListener('input',sync);inp.addEventListener('change',sync);sync();
  });
}

function growthCard(){
  const c=S.child,first=CHILD.split(' ')[0];
  if(!c.birthDate)return `<div class="growth"><div class="card-h" style="margin:0"><h2>Status gizi (standar WHO)</h2><button class="addbtn" data-a="childform">Isi data</button></div>
    <p class="hint">Isi tanggal lahir ${esc(first)} supaya status gizinya bisa dihitung dari BB, PB, dan LK.</p></div>`;
  const ms=S.visits.filter(v=>(v.bb||v.pb||v.lk)&&v.date<=ymd()).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const pick=k=>{const v=ms.find(x=>x[k]);return v?{val:v[k],date:v.date}:(c[k]?{val:c[k],date:c.birthDate}:null);};
  const cell=(ind,k,lab,unit)=>{const p=pick(k);if(!p)return `<div><b>—</b><span>${lab}</span></div>`;

  const gain=last&&last.bb&&c.bb?`BB ${last.bb>=c.bb?'naik':'turun'} ${fmtNum(Math.abs(Math.round((last.bb-c.bb)*100)/100))} kg sejak lahir`:'';
  return `<div class="growth"><div class="card-h" style="margin:0"><h2>Status gizi (standar WHO)</h2><button class="addbtn" data-a="childform">Data lahir</button></div>

function viewVisits(){
  const today=ymd(),key=v=>String(v.date)+' '+(v.time||'99:99');
  const up=S.visits.filter(v=>v.date>=today).sort((a,b)=>key(a).localeCompare(key(b)));
  const past=S.visits.filter(v=>v.date<today).sort((a,b)=>key(b).localeCompare(key(a)));
  let h=growthCard();
  if(up.length){
    const n=up[0],d=daysDiff(today,n.date),t=vt(n.type);
    const who=whoLine(n);
    const ttl=t[1]+(n.type==='imunisasi'&&vaxLabel(n.vaxAge)?' · '+vaxLabel(n.vaxAge):'');
    h+=`<div class="next"><span class="k">Jadwal berikutnya</span><b>${esc(ttl)}</b>
      <span class="m">${CAL}${esc(fmtDateLong(n.date))}${n.time?' · '+dot(n.time):''}${who?'<br>'+who:''}${n.vaccines&&n.vaccines.length?'<br>💉 '+esc(n.vaccines.join(', ')):''}${n.costReimb?'<br>'+reimbLine(n):''}</span>

  }
  h+=`<div class="sec"><h2>Akan datang</h2></div>`;
  const rest=up.slice(1);
  if(rest.length)h+=`<section class="card">${rest.map(visitItem).join('')}</section>`;
  else h+=`<p class="hint" style="margin:0 2px 16px">${up.length?'Tidak ada jadwal lain.':'Belum ada jadwal. Tekan tombol + untuk mencatat jadwal dokter atau imunisasi.'}</p>`;

  return h;
}

/* ---------- events ---------- */
function loginMsg(c){
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return 'Password salah, coba lagi.';
  if(c==='auth/too-many-requests')return 'Terlalu banyak percobaan. Tunggu beberapa menit.';
  if(c==='auth/network-request-failed')return 'Tidak ada koneksi internet.';
  if(c==='auth/operation-not-allowed')return 'Login email/password belum diaktifkan di Firebase.';
  if(c==='auth/user-disabled')return 'Akun ini dinonaktifkan.';
  return 'Gagal masuk ('+(c||'error')+').';
}
async function doLogin(){
  const inp=$('#f-pass');if(!S.loginPick||!inp||!fbAuth)return;
  const pw=inp.value;
  if(!pw){S.loginErr='Isi password dulu.';inp.blur();render();return;}
  inp.blur();S.loginErr='Masuk…';render();
  try{await FB.signInWithEmailAndPassword(fbAuth,S.loginPick+'@'+EMAIL_DOMAIN,pw);S.loginErr='';}
  catch(e){S.loginErr=loginMsg(e&&e.code);render();}
}
async function runMigration(){
  const m=S.migration;if(!m||S.migrating||!isAdmin())return;
  S.migrating=true;render();
  let fail=0;
  const put=async(p,d)=>{try{await S.db.doc(p).set(d);}catch(e){fail++;}};
  if(m.config)await put('config/main',m.config);
  for(const l of m.logs||[]){const {id,...d}=l;await put('days/'+d.date+'/logs/'+id,d);}
  for(const v of m.visits||[]){const {id,...d}=v;await put('visits/'+id,d);}
  for(const x of m.meds||[]){const {id,...d}=x;await put('meds/'+id,d);}
  if(!fail)await put('meta/migration',{at:Date.now(),byRole:S.role,exportedAt:m.exportedAt||''});
  S.migrating=false;
  toast(fail?fail+' data gagal dipindah, coba lagi.':'Data lama berhasil dipindahkan');
  render();
}

  mopen:b=>{const m=S.meds.find(x=>x.id===b.dataset.id);if(m)openMedDetail(m);},
  tstart:b=>startTimer(+b.dataset.i),
  tstop:()=>stopTimer(),
  tcancel:()=>cancelTimer(),
  tadd:b=>openTummyAdd(+b.dataset.i),
  detail:b=>openDetail(b.dataset.id),
  deleted:()=>openDeleted(),
  range:b=>{S.recapRange=+b.dataset.v;loadRecap();},
  jump:b=>{S.date=b.dataset.d;S.tab='today';subscribeDay();window.scrollTo(0,0);}
};
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b);});
$('#app').addEventListener('change',e=>{
  if(e.target.dataset.c!=='migrfile'||!e.target.files||!e.target.files[0])return;
  e.target.files[0].text().then(t=>{
    const j=JSON.parse(t);
    if(!j||!Array.isArray(j.logs))throw new Error('format');
    S.migration=j;render();
  }).catch(()=>toast('File tidak dikenali. Pastikan memilih migrasi.json.'));
});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='f-pass'){e.preventDefault();doLogin();}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pendingRender&&$('#sb').hidden){S.pendingRender=false;render();}},60);});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const t=ymd();
  if(S.lastToday&&S.lastToday!==t&&S.date===S.lastToday){S.date=t;subscribeDay();}
  S.lastToday=t;
});
function tick(){if(!S.timer)return;const t=clock(Date.now()-S.timer.start);document.querySelectorAll('.tclock').forEach(el=>{el.textContent=t;});}

/* ---------- init ---------- */
async function init(){
  S.date=ymd();S.lastToday=S.date;
  render();setInterval(tick,1000);
  try{
    const app=FB.initializeApp(FIREBASE_CONFIG);
    fbAuth=FB.getAuth(app);
    let fs;
    try{fs=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})});}
    catch(e){fs=FB.initializeFirestore(app,{});}
    S.db=mkDB(fs);
  }catch(e){S.authReady=true;S.err='Gagal memuat Firebase. Periksa koneksi lalu buka ulang.';render();return;}
  FB.onAuthStateChanged(fbAuth,u=>{
    if(u){
      const r=String(u.email||'').split('@')[0].toLowerCase();
      if(!LOGIN_ROLES.includes(r)){S.authReady=true;S.loginErr='Akun ini tidak dikenal.';FB.signOut(fbAuth);return;}
      S.role=r;S.uid=u.uid;S.authReady=true;S.loginErr='';
      if(!S.subscribed){S.subscribed=true;subscribeShared();subscribeDay();}
      render();
    }else{
      if(S.subscribed){location.reload();return;}
      S.role=null;S.authReady=true;render();
    }
  });
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
</body>
